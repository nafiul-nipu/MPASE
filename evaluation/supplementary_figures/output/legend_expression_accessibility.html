<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expression Accessibility Legend</title>
  <style>
    :root {
      --expr-acc-up: #a02c2c;
      --expr-acc-down: #c1bcbb;
      --expression-only: #1111de;
      --accessibility-only: #c1e469;
      --bg: #000000;
      --fg: #f4f4f4;
      --muted: #d8d8d8;
      --border: rgba(255, 255, 255, 0.28);
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .legend {
      display: inline-flex;
      align-items: center;
      gap: 22px;
      padding: 12px 14px;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
    }

    .item {
      display: grid;
      grid-template-columns: 14px auto;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.25;
      white-space: nowrap;
    }

    .swatch {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      border: 0;
    }

    .expr-acc-up {
      background: var(--expr-acc-up);
    }

    .expr-acc-down {
      background: var(--expr-acc-down);
    }

    .expression-only {
      background: var(--expression-only);
    }

    .accessibility-only {
      background: var(--accessibility-only);
    }
  </style>
</head>
<body>
  <aside class="legend" aria-label="Expression and accessibility color legend">
    <div class="item">
      <span class="swatch expr-acc-up" aria-hidden="true"></span>
      <span>Expression + accessibility up</span>
    </div>
    <div class="item">
      <span class="swatch expr-acc-down" aria-hidden="true"></span>
      <span>Expression + accessibility down</span>
    </div>
    <div class="item">
      <span class="swatch expression-only" aria-hidden="true"></span>
      <span>Expression only</span>
    </div>
    <div class="item">
      <span class="swatch accessibility-only" aria-hidden="true"></span>
      <span>Accessibility only</span>
    </div>
  </aside>
</body>
</html>
